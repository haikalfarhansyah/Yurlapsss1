name: Build Windows EXE

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Versi rilis (contoh: 0.2.0). Kosong = pakai versi di kode."
        required: false
        default: ""
      make_installer:
        description: "Buat installer .exe (butuh Inno Setup)"
        type: boolean
        default: true
      base_url:
        description: "URL folder unggahan untuk update.json (opsional)"
        required: false
        default: ""

jobs:
  # ---------------------------------------------------------------------------
  # 1) TES — cepat (~1 menit). Kalau ini merah, build tidak dijalankan.
  # ---------------------------------------------------------------------------
  test:
    name: Tes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Repo bisa berisi kode di root ATAU di dalam subfolder (mis. stintlab/).
      # Langkah ini mencari lokasinya supaya semua langkah berikut tidak perlu
      # diubah kalau struktur foldernya berbeda.
      - name: Deteksi folder proyek
        id: detect
        shell: bash
        run: |
          root="."
          if [ ! -f "$root/stintlab.spec" ]; then
            found=$(find . -maxdepth 3 -name stintlab.spec -printf '%h\n' 2>/dev/null | head -1)
            if [ -n "$found" ]; then root="$found"; fi
          fi
          echo "Proyek ditemukan di: $root"
          ls -la "$root" | head -20
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Info lingkungan (untuk diagnosis kalau ada yang gagal)
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          python -c "import sys,platform;print('Python',sys.version);print(platform.platform())"
          python -m pip --version

      - name: Install dependensi
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          python -m pip install --upgrade pip
          pip install pyzmq flask

      # Berhenti lebih awal dengan pesan jelas kalau ada file yang masih versi
      # lama (penyebab paling sering: file gagal tertimpa saat push).
      - name: Verifikasi versi file
        working-directory: ${{ steps.detect.outputs.root }}
        run: python tools/verifikasi_file.py

      - name: Tes logika timing & penyimpanan
        working-directory: ${{ steps.detect.outputs.root }}
        run: python tests/test_smoke.py

      - name: Tes API & sinkronisasi online
        working-directory: ${{ steps.detect.outputs.root }}
        run: python tests/test_integration.py

      - name: Tes supervisor decoder & pembaruan
        working-directory: ${{ steps.detect.outputs.root }}
        run: python tests/test_manager.py

  # ---------------------------------------------------------------------------
  # 2) BUILD — menghasilkan portable zip, installer, dan update.json
  # ---------------------------------------------------------------------------
  build:
    name: Build EXE
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Deteksi folder proyek
        id: detect
        shell: bash
        run: |
          root="."
          if [ ! -f "$root/stintlab.spec" ]; then
            found=$(find . -maxdepth 3 -name stintlab.spec -printf '%h\n' 2>/dev/null | head -1)
            if [ -n "$found" ]; then root="$found"; fi
          fi
          echo "Proyek ditemukan di: $root"
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Install dependensi
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          python -m pip install --upgrade pip
          pip install pyzmq pyinstaller

      - name: Ambil komponen pihak ketiga (Zadig + OpenStint)
        working-directory: ${{ steps.detect.outputs.root }}
        run: python tools/fetch_vendor.py
        continue-on-error: true        # aplikasi tetap bisa dibangun tanpanya

      - name: Build EXE
        working-directory: ${{ steps.detect.outputs.root }}
        run: pyinstaller --noconfirm --clean stintlab.spec

      - name: Uji EXE native (jendela Tk muncul, tanpa port)
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          $env:YURLAPS_DATA = "$env:RUNNER_TEMP\yl-native"
          $p = Start-Process -FilePath "dist\YurLaps\YurLaps.exe" `
               -ArgumentList "--native" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            throw "YurLaps.exe keluar sendiri (crash?) - kode $($p.ExitCode)"
          }
          $wins = Get-Process -Id $p.Id | Select-Object -ExpandProperty MainWindowTitle
          Write-Host "JENDELA:" $wins
          if (-not $wins) { throw "Jendela aplikasi tidak muncul" }
          Stop-Process -Id $p.Id -Force

      # Catatan: blok run di YAML tidak perlu escape kutip ganda. Menulis
      # backslash + kutip justru membuat PowerShell gagal parse (sudah kejadian).
      - name: Uji EXE mode web (health + UI untuk HP/TV)
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          $env:YURLAPS_DATA = "$env:RUNNER_TEMP\yl-health"
          $p = Start-Process -FilePath "dist\YurLaps\YurLaps.exe" `
               -ArgumentList "--web","--no-browser","--port","8098" -PassThru
          Start-Sleep -Seconds 12
          try {
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:8098/api/health" -UseBasicParsing -TimeoutSec 10
            Write-Host "HEALTH:" $r.Content
            $u = Invoke-WebRequest -Uri "http://127.0.0.1:8098/" -UseBasicParsing -TimeoutSec 10
            $html = $u.Content
            $menuPractice = 'data-view="practice"'
            $menuDecoder = 'data-view="decoder"'
            if (-not $html.Contains($menuPractice) -or -not $html.Contains($menuDecoder)) {
              throw "UI web tidak lengkap (menu Practice/Decoder tidak ditemukan)"
            }
            Write-Host "UI web: Practice + Decoder OK"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Zip versi portable
        working-directory: ${{ steps.detect.outputs.root }}
        run: Compress-Archive -Path dist/YurLaps/* -DestinationPath dist/YurLaps-portable.zip

      - name: Install Inno Setup
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.make_installer }}
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Verifikasi hasil build
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          Get-ChildItem dist\YurLaps | Select-Object -First 12 Name, Length
          if (-not (Test-Path "dist\YurLaps\YurLaps.exe")) {
            throw "dist\YurLaps\YurLaps.exe tidak ditemukan - build PyInstaller gagal?"
          }

      - name: Build installer
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.make_installer }}
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\stintlab.iss

      - name: Siapkan manifest pembaruan (update.json)
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          args="--dir dist --out dist/update.json"
          [ -n "${{ inputs.version }}" ] && args="$args --version ${{ inputs.version }}"
          [ -n "${{ inputs.base_url }}" ] && args="$args --base-url ${{ inputs.base_url }}"
          python tools/buat_update_manifest.py $args
          echo "---- isi update.json ----"
          cat dist/update.json

      - name: Ringkasan artefak
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v7
        with:
          name: YurLaps-windows
          path: |
            ${{ steps.detect.outputs.root }}/dist/YurLaps-portable.zip
            ${{ steps.detect.outputs.root }}/dist/YurLaps-Setup-*.exe
            ${{ steps.detect.outputs.root }}/dist/update.json
          retention-days: 30
          if-no-files-found: error
