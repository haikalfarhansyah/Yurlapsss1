name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      make_installer:
        description: "Buat installer juga"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Tes logika (Linux, cepat)
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependensi
        run: pip install pyzmq flask pyinstaller
      - name: Verifikasi kelengkapan file
        run: python tools/verifikasi_file.py
      - name: Tes logika timing & storage
        run: python tests/test_smoke.py
        env:
          YURLAPS_DATA: ${{ runner.temp }}/yl-smoke
      - name: Tes integrasi REST + SSE
        run: python tests/test_integration.py
        env:
          YURLAPS_DATA: ${{ runner.temp }}/yl-int
      - name: Tes supervisor decoder + updater
        run: python tests/test_manager.py
        env:
          YURLAPS_DATA: ${{ runner.temp }}/yl-man

  # ---------------------------------------------------------------------------
  # 2. Build Windows: mesin Python + jendela Electron
  # ---------------------------------------------------------------------------
  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deteksi folder proyek
        id: detect
        shell: pwsh
        run: |
          $root = "."
          if (Test-Path "stintlab/stintlab.spec") { $root = "stintlab" }
          "root=$root" >> $env:GITHUB_OUTPUT
          Write-Host "Folder proyek: $root"

      - name: Install dependensi Python
        working-directory: ${{ steps.detect.outputs.root }}
        run: pip install -r requirements.txt pyinstaller

      - name: Ambil komponen pihak ketiga (Zadig + OpenStint)
        working-directory: ${{ steps.detect.outputs.root }}
        run: python tools/fetch_vendor.py
        continue-on-error: true        # aplikasi tetap bisa dibangun tanpanya

      # ---- 2a. Mesin (tanpa Tk, dipanggil jendela Electron) ----
      - name: Build mesin YurLapsEngine.exe
        working-directory: ${{ steps.detect.outputs.root }}
        run: pyinstaller --noconfirm --clean tools/engine.spec

      - name: Pastikan UI ikut di dalam mesin
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          if (-not (Test-Path "desktop\engine\_internal\app\static\index.html")) {
            throw "UI web (app/static) tidak ikut dibundel - mesin akan menampilkan 404"
          }
          Write-Host "OK: UI ada di dalam bundel mesin"

      - name: Uji mesin mengirim port (protokol ke Electron)
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          $env:YURLAPS_DATA = "$env:RUNNER_TEMP\yl-engine"
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "desktop\engine\YurLapsEngine.exe"
          $psi.Arguments = "--electron"
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardInput = $true
          $psi.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($psi)
          $line = $p.StandardOutput.ReadLine()
          Write-Host "BARIS PERTAMA:" $line
          if (-not $line.Contains('"event": "ready"')) { throw "mesin tidak mengirim ready" }
          $p.StandardInput.Close()
          if (-not $p.WaitForExit(20000)) { $p.Kill(); throw "mesin tidak berhenti saat stdin ditutup" }
          Write-Host "OK: mesin siap dan berhenti rapi"

      # ---- 2b. Jendela Electron ----
      - name: Install dependensi Node (Electron)
        working-directory: ${{ steps.detect.outputs.root }}/desktop
        run: npm ci

      - name: Uji jendela Electron (mesin + UI + preload)
        working-directory: ${{ steps.detect.outputs.root }}/desktop
        env:
          YURLAPS_PYTHON: python
        run: npx electron test/smoke.js

      - name: Build installer Electron (NSIS + portable)
        working-directory: ${{ steps.detect.outputs.root }}/desktop
        run: npm run dist

      # ---- 2c. Installer Inno (jalur pembaruan /UPDATEZIP) ----
      - name: Install Inno Setup
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.make_installer }}
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Siapkan folder dist untuk Inno
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\YurLaps | Out-Null
          Copy-Item dist-electron\win-unpacked\* dist\YurLaps\ -Recurse -Force
          if (-not (Test-Path "dist\YurLaps\YurLaps.exe")) { throw "dist\YurLaps\YurLaps.exe tidak ada" }

      - name: Build installer Inno (YurLaps-Setup untuk pembaruan)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.make_installer }}
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\stintlab.iss
          if (-not (Test-Path "dist\YurLaps-Setup-*.exe")) { throw "installer Inno gagal" }

      - name: Siapkan manifest pembaruan (update.json)
        working-directory: ${{ steps.detect.outputs.root }}
        run: python tools/buat_update_manifest.py

      - name: Ringkasan artefak
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          Get-ChildItem dist-electron | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          Get-ChildItem dist -Filter *.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v7
        with:
          name: YurLaps-Windows
          path: |
            ${{ steps.detect.outputs.root }}/dist-electron/*.exe
            ${{ steps.detect.outputs.root }}/dist-electron/*.zip
            ${{ steps.detect.outputs.root }}/dist/*.exe
            ${{ steps.detect.outputs.root }}/dist/*.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3. Mode Tk lama (Windows 8/8.1): tetap dibangun sebagai alternatif
  # ---------------------------------------------------------------------------
  build-legacy-native:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Deteksi folder proyek
        id: detect
        shell: pwsh
        run: |
          $root = "."
          if (Test-Path "stintlab/stintlab.spec") { $root = "stintlab" }
          "root=$root" >> $env:GITHUB_OUTPUT
      - name: Install dependensi
        working-directory: ${{ steps.detect.outputs.root }}
        run: pip install -r requirements.txt pyinstaller
      - name: Build EXE native Tk (Windows 8/8.1)
        working-directory: ${{ steps.detect.outputs.root }}
        run: pyinstaller --noconfirm --clean stintlab.spec
      - name: Uji jendela Tk muncul
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          $env:YURLAPS_DATA = "$env:RUNNER_TEMP\yl-native"
          $p = Start-Process -FilePath "dist\YurLaps\YurLaps.exe" -ArgumentList "--native" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "YurLaps.exe keluar sendiri (kode $($p.ExitCode))" }
          $wins = Get-Process -Id $p.Id | Select-Object -ExpandProperty MainWindowTitle
          Write-Host "JENDELA:" $wins
          if (-not $wins) { throw "Jendela Tk tidak muncul" }
          Stop-Process -Id $p.Id -Force
      - name: Zip versi portable (Tk)
        working-directory: ${{ steps.detect.outputs.root }}
        run: Compress-Archive -Path dist/YurLaps/* -DestinationPath dist/YurLaps-portable.zip
      - uses: actions/upload-artifact@v7
        with:
          name: YurLaps-Windows-Tk
          path: ${{ steps.detect.outputs.root }}/dist/YurLaps-portable.zip
          if-no-files-found: warn
