name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      make_installer:
        description: "Buat installer juga"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Tes logika (Linux, cepat)
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependensi
        run: pip install pyzmq flask pyinstaller
      - name: Pastikan paket yang diunggah versi terbaru
        run: |
          test -f VERSI-PAKET.txt || { echo "VERSI-PAKET.txt tidak ada: zip lama"; exit 1; }
          grep -q "tanpa-hook-nsis" VERSI-PAKET.txt || { echo "penanda paket tidak cocok: zip lama"; exit 1; }
          if [ -f desktop/build/installer-hooks.nsh ]; then echo "hook NSIS lama masih ada"; exit 1; fi
          grep -q '"include"' desktop/package.json && { echo "package.json masih memakai nsis.include"; exit 1; }
          echo "OK: paket terbaru"
      - name: Cek cepat Python polos (tanpa paket apa pun)
        run: python -S tools/verifikasi_file.py | tail -3
      - name: Verifikasi kelengkapan file
        run: python tools/verifikasi_file.py
      - name: Tes logika timing & storage
        run: python tests/test_smoke.py
        env:
          YURLAPS_DATA: ${{ runner.temp }}/yl-smoke
      - name: Tes integrasi REST + SSE
        run: python tests/test_integration.py
        env:
          YURLAPS_DATA: ${{ runner.temp }}/yl-int
      - name: Tes supervisor decoder + updater
        run: python tests/test_manager.py
        env:
          YURLAPS_DATA: ${{ runner.temp }}/yl-man

  # ---------------------------------------------------------------------------
  # 2. Decoder YurLaps: dibangun dari sumber OpenStint (GPL-3.0), satu patch
  #    nama target. Hasilnya dipakai job "build" di bawah, jadi satu repo
  #    menghasilkan aplikasi + decoder sekaligus.
  # ---------------------------------------------------------------------------
  decoder:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-cppzmq
            mingw-w64-x86_64-libusb
            git
            make
            autoconf
            automake
            libtool
            pkg-config
            zip

      - name: Ambil sumber OpenStint + patch YurLaps
        shell: msys2 {0}
        run: |
          set -eu
          # Runner Windows memakai core.autocrlf=true -> berkas checkout menjadi
          # CRLF, dan setiap baris konteks patch LF tidak lagi cocok
          # ("patch does not apply"). Paksa LF untuk semua berkas teks.
          git config --global core.autocrlf false
          git config --global core.eol lf
          REF="$(tr -d '[:space:]' < decoder/patch/upstream-ref.txt)"
          echo "OpenStint versi: $REF"
          rm -rf upstream
          git clone --depth 1 --branch "$REF" \
            -c core.autocrlf=false -c core.eol=lf \
            https://github.com/zsellera/openstint.git upstream
          cd upstream
          git rev-parse HEAD | tee ../upstream-commit.txt

          # Jaring pengaman: kalau checkout tetap CRLF, ubah ke LF sebelum patch.
          CR=$(tr -cd '\r' < src/CMakeLists.txt | wc -c)
          if [ "$CR" -ne 0 ]; then
            echo "checkout ber-CRLF ($CR baris) - mengubah ke LF"
            # CRLF -> LF tanpa bergantung pada paket tambahan
            tr -d '\r' < src/CMakeLists.txt > src/CMakeLists.new
            mv src/CMakeLists.new src/CMakeLists.txt
          fi

          # Cadangan terakhir: kalau git apply tetap menolak (mis. baris
          # konteks bergeser karena versi upstream berubah), lakukan
          # penggantian langsung - inilah satu-satunya isi patch kita.
          if ! git apply --verbose ../decoder/patch/rename-target.patch; then
            echo "git apply gagal - memakai penggantian langsung"
            sed -i 's/openstint_add_decoder(openstint_rtlsdr /openstint_add_decoder(YurLapsDecoder /' \
              src/CMakeLists.txt
            grep -n "openstint_add_decoder(YurLapsDecoder" src/CMakeLists.txt
          fi
          # Pastikan hasil akhirnya benar, apa pun jalur yang dipakai.
          if ! grep -q "openstint_add_decoder(YurLapsDecoder main_rtlsdr.cpp" src/CMakeLists.txt; then
            echo "GAGAL: nama target tidak berubah menjadi YurLapsDecoder"; exit 1
          fi
          echo "OK: target decoder bernama YurLapsDecoder"

      - name: Install liquid-dsp
        shell: msys2 {0}
        run: |
          set -eu
          LIQUID=https://raw.githubusercontent.com/cjcliffe/CubicSDR/refs/heads/master/external/liquid-dsp
          mkdir -p /mingw64/include/liquid
          curl -sSfL -o /mingw64/include/liquid/liquid.h "$LIQUID/include/liquid/liquid.h"
          curl -sSfL -o /mingw64/lib/libliquid.a        "$LIQUID/gcc/64/libliquid.a"

      - name: Install libfec
        shell: msys2 {0}
        run: |
          set -eu
          git clone --depth 1 https://github.com/quiet/libfec.git
          cd libfec
          ./configure --prefix=/mingw64
          sed -i 's/-lc$//' Makefile
          sed -i 's/libfec\.so/libfec.dll/' Makefile
          make
          cp libfec.dll libfec.a /mingw64/lib
          cp fec.h /mingw64/include

      - name: Build YurLapsDecoder.exe
        shell: msys2 {0}
        run: |
          set -eu
          cd upstream
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_HACKRF=OFF -DUSE_RTLSDR=ON -B build .
          ninja -C build
          cmake --install build --prefix "$PWD/staging"

      - name: Kumpulkan biner + DLL + atribusi
        shell: msys2 {0}
        run: |
          set -eu
          cd upstream
          mkdir -p ../decoder-out
          cp staging/bin/YurLapsDecoder.exe ../decoder-out/
          # ntldd bisa tidak ada / gagal di lingkungan MSYS2 tertentu; kalau
          # begitu, salin DLL yang pasti dibutuhkan dari /mingw64/bin.
          DLLS=""
          if command -v ntldd >/dev/null 2>&1; then
            DLLS=$(ntldd -R ../decoder-out/YurLapsDecoder.exe 2>/dev/null \
                   | grep -i mingw64 | awk '{print $3}' | tr -d '<>' | sort -u || true)
          fi
          if [ -z "$DLLS" ]; then
            echo "ntldd tidak tersedia - memakai daftar DLL tetap"
            DLLS="libzmq.dll libsodium.dll libusb-1.0.dll libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll"
          fi
          for dll in $DLLS; do
            if [ -f "/mingw64/bin/$dll" ]; then
              cp "/mingw64/bin/$dll" ../decoder-out/
            elif [ -f "$dll" ]; then
              cp "$dll" ../decoder-out/
            else
              echo "  (lewat) $dll"
            fi
          done
          cp "$GITHUB_WORKSPACE/decoder/ATTRIBUTION.txt" ../decoder-out/
          echo "isi paket decoder:"; ls -la ../decoder-out

      - name: Uji decoder bisa dijalankan
        shell: msys2 {0}
        run: |
          set -eu
          cd decoder-out
          OUT=$(./YurLapsDecoder.exe --salah 2>&1 || true)
          if printf '%s' "$OUT" | grep -q "Usage"; then
            echo "OK: YurLapsDecoder berjalan"
          else
            echo "Keluaran decoder:"; printf '%s\n' "$OUT" | head -5
            echo "GAGAL: decoder tidak mencetak Usage"; exit 1
          fi

      - name: Simpan decoder + sumber (kepatuhan GPL-3.0)
        shell: msys2 {0}
        run: |
          set -eu
          cd upstream && rm -rf build staging .git && cd ..
          zip -qr yurlaps-decoder-src.zip upstream

      - uses: actions/upload-artifact@v7
        with:
          name: yurlaps-decoder
          path: |
            decoder-out/*
            yurlaps-decoder-src.zip
            upstream-commit.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Build Windows: mesin Python + jendela Electron
  # ---------------------------------------------------------------------------
  build:
    needs: [test, decoder]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deteksi folder proyek
        id: detect
        shell: pwsh
        run: |
          $root = "."
          if (Test-Path "stintlab/stintlab.spec") { $root = "stintlab" }
          "root=$root" >> $env:GITHUB_OUTPUT
          Write-Host "Folder proyek: $root"

      # Pagar anti-zip-lama: kalau yang diunggah masih paket sebelum perbaikan,
      # build dihentikan SEKARANG dengan pesan jelas, bukan gagal 90 detik
      # kemudian di tengah NSIS dengan pesan "File ... no files found".
      - name: Pastikan paket yang diunggah versi terbaru
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          if (-not (Test-Path "VERSI-PAKET.txt")) {
            throw "VERSI-PAKET.txt tidak ada: zip yang diunggah adalah paket lama. Unggah ulang yurlaps-0.3.0-full.zip versi terbaru."
          }
          $t = Get-Content "VERSI-PAKET.txt" -Raw
          if ($t -notmatch "tanpa-hook-nsis") {
            throw "Penanda paket tidak cocok: unggah ulang zip terbaru (lihat VERSI-PAKET.txt)."
          }
          if (Test-Path "desktop/build/installer-hooks.nsh") {
            throw "Masih ada desktop/build/installer-hooks.nsh: paket lama. File itu sudah dihapus di versi terbaru."
          }
          $pkg = Get-Content "desktop/package.json" -Raw
          if ($pkg -match '"include"') {
            throw "desktop/package.json masih memakai nsis.include: paket lama."
          }
          Write-Host "OK: paket terbaru (tanpa hook NSIS)"

      - name: Install dependensi Python
        working-directory: ${{ steps.detect.outputs.root }}
        run: pip install -r requirements.txt pyinstaller

      # Decoder dibangun di job "decoder" pada workflow ini juga (satu repo),
      # lalu diunduh ke vendor/openstint sebelum aplikasi dibangun.
      - name: Unduh decoder hasil job decoder
        uses: actions/download-artifact@v5
        with:
          name: yurlaps-decoder
          path: ${{ steps.detect.outputs.root }}/vendor/openstint

      - name: Pastikan decoder siap dipakai
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem vendor\openstint -Filter "YurLapsDecoder*" -ErrorAction SilentlyContinue
          if ($exe) {
            Write-Host "OK: memakai decoder YurLaps ($($exe[0].Name))"
            if (-not (Test-Path "vendor\openstint\ATTRIBUTION.txt")) {
              throw "ATTRIBUTION.txt tidak ada: atribusi GPL-3.0 wajib ikut"
            }
          } else {
            Write-Host "Catatan: decoder YurLaps belum tersedia; aplikasi tetap dibangun."
          }

      # ---- 2a. Mesin (tanpa Tk, dipanggil jendela Electron) ----
      - name: Build mesin YurLapsEngine.exe
        working-directory: ${{ steps.detect.outputs.root }}
        run: pyinstaller --noconfirm --clean tools/engine.spec

      - name: Pastikan UI ikut di dalam mesin
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          if (-not (Test-Path "desktop\engine\_internal\app\static\index.html")) {
            throw "UI web (app/static) tidak ikut dibundel - mesin akan menampilkan 404"
          }
          Write-Host "OK: UI ada di dalam bundel mesin"

      - name: Uji mesin mengirim port (protokol ke Electron)
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          $env:YURLAPS_DATA = "$env:RUNNER_TEMP\yl-engine"
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "desktop\engine\YurLapsEngine.exe"
          $psi.Arguments = "--electron"
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardInput = $true
          $psi.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($psi)
          $line = $p.StandardOutput.ReadLine()
          Write-Host "BARIS PERTAMA:" $line
          if (-not $line.Contains('"event": "ready"')) { throw "mesin tidak mengirim ready" }
          $p.StandardInput.Close()
          if (-not $p.WaitForExit(20000)) { $p.Kill(); throw "mesin tidak berhenti saat stdin ditutup" }
          Write-Host "OK: mesin siap dan berhenti rapi"

      # ---- 2b. Jendela Electron ----
      - name: Install dependensi Node (Electron)
        working-directory: ${{ steps.detect.outputs.root }}/desktop
        run: npm ci

      - name: Uji jendela Electron (mesin + UI + preload)
        working-directory: ${{ steps.detect.outputs.root }}/desktop
        env:
          YURLAPS_PYTHON: python
        run: npx electron test/smoke.js

      # ---- 2c. Installer Inno (jalur pembaruan /UPDATEZIP) ----
      # Urutannya penting: Inno harus SELESAI sebelum app.asar dibangun, karena
      # electron-builder menyalin YurLaps-Setup.exe ke dalam paketnya sebagai
      # extraResources. Kalau urutannya dibalik, file itu belum ada.
      - name: Install Inno Setup
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.make_installer }}
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Siapkan folder dist untuk Inno
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist\YurLaps | Out-Null

      - name: Build installer Electron (NSIS + portable)
        working-directory: ${{ steps.detect.outputs.root }}/desktop
        run: npm run dist

      - name: Siapkan aplikasi untuk installer pembaruan (Inno)
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          # dist\YurLaps hanya berisi APLIKASI (bukan installer) supaya
          # installer tidak memungut dirinya sendiri. Hasil Inno ditulis ke
          # dist\ dengan nama YurLaps-Setup-<versi>-full.exe.
          New-Item -ItemType Directory -Force dist\YurLaps | Out-Null
          Copy-Item dist-electron\win-unpacked\* dist\YurLaps\ -Recurse -Force
          Remove-Item dist\YurLaps\*.exe -Exclude "YurLaps.exe" -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path "dist\YurLaps\YurLaps.exe")) { throw "dist\YurLaps\YurLaps.exe tidak ada" }

      - name: Build installer Inno (YurLaps-Setup untuk pembaruan)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.make_installer }}
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\stintlab.iss
          if (-not (Test-Path "dist\YurLaps-Setup-*.exe")) { throw "installer Inno gagal" }

      - name: Siapkan manifest pembaruan (update.json)
        working-directory: ${{ steps.detect.outputs.root }}
        run: python tools/buat_update_manifest.py

      - name: Ringkasan artefak
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          Write-Host "=== INSTALLER UTAMA (pakai ini) ==="
          Get-ChildItem dist-electron -Include *.exe,*.zip -Recurse -Depth 0 |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          Write-Host ""
          Write-Host "=== ALAT PEMBARUAN (bukan untuk dipasang manual) ==="
          Get-ChildItem dist -Filter *-full.exe |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          Write-Host ""
          Write-Host "update.json:"
          Get-ChildItem dist -Filter *.json | Select-Object Name

      - uses: actions/upload-artifact@v7
        with:
          name: YurLaps-Windows
          path: |
            ${{ steps.detect.outputs.root }}/dist-electron/*.exe
            ${{ steps.detect.outputs.root }}/dist-electron/*.zip
            ${{ steps.detect.outputs.root }}/dist/*-full.exe
            ${{ steps.detect.outputs.root }}/dist/*.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3. Mode Tk lama (Windows 8/8.1): tetap dibangun sebagai alternatif
  # ---------------------------------------------------------------------------
