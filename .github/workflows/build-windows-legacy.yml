name: Build Windows EXE (Win 7/8/8.1)

# Build terpisah KHUSUS Windows lama. Alasannya:
#   * Python 3.12+ tidak lagi mendukung Windows 8.1 (PEP 11) -> pakai Python 3.11
#   * WebView2 (jendela aplikasi) mentok di versi 109 untuk Windows 8.1
#     -> aplikasi berjalan dalam MODE BROWSER (UI tetap sama)
#
# Hasil: YurLaps-win8-portable.zip  (ekstrak, jalankan YurLaps.exe)

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: "Versi Python untuk build Windows lama (3.8 = paling kompatibel)"
        required: false
        default: "3.11"

jobs:
  build-legacy:
    name: Build EXE (Windows lama)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version || '3.11' }}

      - name: Deteksi folder proyek
        id: detect
        shell: bash
        run: |
          root="."
          if [ ! -f "$root/stintlab.spec" ]; then
            found=$(find . -maxdepth 3 -name stintlab.spec -printf '%h\n' 2>/dev/null | head -1)
            if [ -n "$found" ]; then root="$found"; fi
          fi
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Info Python
        run: python -c "import sys;print(sys.version)"

      - name: Install dependensi
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          python -m pip install --upgrade pip
          pip install pyzmq pyinstaller

      # pywebview TIDAK diikutkan: jendela aplikasi tidak didukung Windows 8.1.
      - name: Build EXE (mode browser)
        working-directory: ${{ steps.detect.outputs.root }}
        run: pyinstaller --noconfirm --clean stintlab-win8.spec

      - name: Uji hasil build (health check)
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          $env:YURLAPS_DATA = "$env:RUNNER_TEMP\\sl-win8"
          $p = Start-Process -FilePath "dist\\YurLaps-win8\\YurLaps.exe" `
               -ArgumentList "--native" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "YurLaps.exe keluar sendiri (crash?)" }
          $wins = Get-Process -Id $p.Id | Select-Object -ExpandProperty MainWindowTitle
          Write-Host "JENDELA:" $wins
          if (-not $wins) { throw "Jendela aplikasi tidak muncul" }
          Stop-Process -Id $p.Id -Force

      - name: Zip
        working-directory: ${{ steps.detect.outputs.root }}
        run: Compress-Archive -Path dist/YurLaps-win8/* -DestinationPath dist/YurLaps-win8-portable.zip

      - uses: actions/upload-artifact@v7
        with:
          name: YurLaps-windows-legacy
          path: ${{ steps.detect.outputs.root }}/dist/YurLaps-win8-portable.zip
          retention-days: 30
          if-no-files-found: error
